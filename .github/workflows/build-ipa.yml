name: Build IPA (no Mac needed)

# 在 GitHub 的云端 macOS 上把 Swift 代码编译成「未签名 IPA」，
# 你下载后用 Windows/Linux 电脑通过 Sideloadly / AltStore + 免费 Apple ID 侧载到 iPad。
# 触发方式：push 到 main/master 自动跑，或在 Actions 页手动 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned .app (device, arm64)
        # CODE_SIGNING_ALLOWED=NO → 跳过签名，产出未签名 .app，供侧载工具重新签名
        run: |
          xcodebuild build \
            -project OverlayBoard.xcodeproj \
            -target OverlayBoard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          # xcodebuild 命令行默认把产物输出到仓库内的 build/ 目录
          APP=$(find . -path '*/Release-iphoneos/OverlayBoard.app' -type d | head -1)
          echo "Found app: $APP"
          [ -d "$APP" ] || { echo "❌ 未找到 OverlayBoard.app，构建可能失败"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -r OverlayBoard-unsigned.ipa Payload
          echo "✅ IPA: $(pwd)/OverlayBoard-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayBoard-unsigned-ipa
          path: build/OverlayBoard-unsigned.ipa
          if-no-files-found: error
